<!DOCTYPE html>
<head>
<title>Organigrama Seremi Salud Región Metropolitana</title>
<link rel="shortcut icon" type="image/x-icon" href="./favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<script>
	function ready(fn) {
	  if (document.readyState !== 'loading') {
	    fn();
	  } else {
	    document.addEventListener('DOMContentLoaded', fn);
	  }
	}
</script>
<style>
	*,
	*::before,
	*::after {
		box-sizing: border-box;
	}
	::root {
		color-scheme: light only;
	}
	::backdrop {
		background-color: #fff;
	}

	::selection {
	  background-color: #0b437f;
	  color: #E9E9E9;
	}

	html {
		color: #222;
		font-size: 1em;
		line-height: 1.4;
	}
	html,body {
		width: 100%;
		height: 100%;
	}
	body {
		font-family: Seravek, 'Gill Sans Nova', Ubuntu, Calibri, 'DejaVu Sans', source-sans-pro, sans-serif;
		background-color: #fff;
		overflow: hidden;
		margin: 0;
		padding: 0;
		user-select: none;
		border:1px solid #D8D8D8;
	}
	p {
		line-height: 1.3em;
		text-indent: 1.4em;
		text-align: justify;
	}
	h1,h2,h3 {
		margin: 0;
		text-wrap: balance;
		line-height: 1em;
	}
	h1, h3 {
		font-family: Avenir, Montserrat, Corbel, 'URW Gothic', source-sans-pro, sans-serif;
		font-weight: 100;
	}
	h1 {
		letter-spacing: -0.05em;
		color: #05203d;
	}
	h2 {
		color: #0b437f;
		font-size: 1em;

	}
	h3 {
		color: #0b437f;
		font-size: 0.75em;
		font-variant: small-caps;
	}
	hr {
		margin-top: 0.075em;
		background-color: #E94961;
		border: 0;
		height: 2px;
	}

	#contenedor {
		width: 100%;
		height: 100%;
	}

	#panel {
		padding: 0.6em 2em;
		background-color: #E9E9E9;
		width: 50%;
		height: 100%;
		position: fixed;
		top:0;
		right:0;
		bottom: 0;
		left: auto;
		z-index: 1001;
		user-select: text;
		font-size: 1.5em;
		overflow: hidden;
		overflow-y: auto;
		box-shadow: -1px 0 1px rgba(0,0,0,0.1),-2px 0 2px rgba(0,0,0,0.1),-4px 0 4px rgba(0,0,0,0.1),-8px 0 8px rgba(0,0,0,0.1);
	}
	@media only screen and (orientation: portrait) {
		#panel {
			width:100%;
			height: 50%;
			top: auto;
			right: 0;
			bottom: 0;
			left: 0;
			box-shadow: 0 -1px 1px rgba(0,0,0,0.1),0 -2px 2px rgba(0,0,0,0.1),0 -4px 4px rgba(0,0,0,0.1),0 -8px 8px rgba(0,0,0,0.1);
		}
	}
	#cl-barra {
		position: absolute;
		top:0;
		left: 2em;
		width: 140px;
		height: 8px;
		background: linear-gradient(90deg, rgba(15,105,196,1) 41.42%, rgba(226,44,44,1) 41.42%);
	}

	/* Botones flotantes comparten base */
	.botónFlotante {
		position: absolute;
		top: 0.75em;
		width: 2em;
		height: 2em;
		z-index: 1002;
		padding: 0.25em;
		cursor: pointer;
		transition-property: top, left, width, height;
		transition-duration: 75ms;
		background-color: rgba(255,255,255,0.7);
		border-radius: 8px;
		backdrop-filter: blur(2px);
	}
	@media (hover: hover) {
		.botónFlotante:hover {
			top: 0.5em;
			width: 2.5em;
			height: 2.5em;
		}
	}
	#pantallaCompleta {
		left: 0.75em;
	}
	#busqueda {
		left: 3.5em;
	}
	@media (hover: hover) {
		#pantallaCompleta:hover {
			left: 0.5em;
		}
		#busqueda:hover {
			left: 3.25em;
		}
	}

	/* Buscador */
	#buscadorPanel {
		position: absolute;
		top: 0.75em;
		left: 6em;
		z-index: 1002;
		display: flex;
		flex-direction: column;
		gap: 0;
		width: min(420px, calc(100vw - 7em));
	}
	#buscadorInput {
		width: 100%;
		padding: 0.4em 1em;
		border: 2px solid #0b437f;
		border-radius: 999px;
		font-family: inherit;
		font-size: 0.95em;
		color: #05203d;
		background-color: rgba(255,255,255,0.95);
		backdrop-filter: blur(4px);
		outline: none;
		box-shadow: 0 2px 8px rgba(11,67,127,0.15);
	}
	#buscadorInput:focus {
		border-color: #006196;
		box-shadow: 0 2px 12px rgba(11,67,127,0.25);
	}
	#buscadorLista {
		list-style: none;
		margin: 0.3em 0 0 0;
		padding: 0;
		background-color: rgba(255,255,255,0.97);
		border: 1.5px solid #0b437f;
		border-radius: 12px;
		overflow: hidden;
		max-height: 260px;
		overflow-y: auto;
		box-shadow: 0 4px 16px rgba(11,67,127,0.15);
	}
	#buscadorLista:empty {
		display: none;
	}
	#buscadorLista li {
		padding: 0.45em 1em;
		font-size: 0.9em;
		color: #05203d;
		cursor: pointer;
		border-bottom: 1px solid #e0e8f0;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
		transition: background-color 100ms;
	}
	#buscadorLista li:last-child {
		border-bottom: none;
	}
	#buscadorLista li:hover,
	#buscadorLista li.resaltado {
		background-color: #e3edf7;
		color: #0b437f;
	}

	.cuadroOrganigrama {
		cursor: pointer;
	}

	.cuadroOrganigrama rect {
		transition-property: fill;
		transition-duration: 200ms;
	}

	.cuadroOrganigrama.activo {
		pointer-events: none;
	}

	.cuadroOrganigrama.activo rect {
		fill:#006196 !important;
	}

	.cuadroOrganigrama.activo text, .cuadroOrganigrama.activo tspan {
		fill:#ffffff !important;
	}

	.visible {
		transition: opacity 200ms;
		visibility: visible;
		opacity: 1;
	}
	.oculto {
		transition: visibility 400ms, opacity 400ms;
		visibility: hidden;
		opacity: 0;
	}
	#telón {
		z-index: 1009;
		box-shadow: 0 0 10vw 10vw rgb(255, 255, 255) inset;
		position: fixed;
		top: 0;
		right: 0;
		left: 0;
		bottom: 0;
		background-color: rgba(255,255,255,0.75);
		background-image: url("data:image/svg+xml,%3Csvg version='1.1' id='L4' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' x='0px' y='0px' viewBox='0 0 36 36' enable-background='new 0 0 0 0' xml:space='preserve'%3E%3Ccircle fill='%23006196' stroke='none' cx='4' cy='18' r='4'%3E%3Canimate attributeName='opacity' dur='1s' values='0;1;0' repeatCount='indefinite' begin='0.1'/%3E%3C/circle%3E%3Ccircle fill='%23006196' stroke='none' cx='18' cy='18' r='4'%3E%3Canimate attributeName='opacity' dur='1s' values='0;1;0' repeatCount='indefinite' begin='0.2'/%3E%3C/circle%3E%3Ccircle fill='%23006196' stroke='none' cx='32' cy='18' r='4'%3E%3Canimate attributeName='opacity' dur='1s' values='0;1;0' repeatCount='indefinite' begin='0.3'/%3E%3C/circle%3E%3C/svg%3E");
		background-position: 50% 50%;
		background-repeat: no-repeat;
		background-size: 2em;
	}
</style>
</head>
<body>
	<div id="telón"></div>
	<div id="panel" class="oculto">
		<div id="cl-barra"></div>
		<h3></h3>
		<h1></h1>
		<h2></h2>
		<hr>
	</div>
	<div id="contenedor">
		<svg id="Organigrama_SVG" enable-background="new 0 0 1800 810" style="font-family:Seravek, 'Gill Sans Nova', Ubuntu, Calibri, 'DejaVu Sans', source-sans-pro, sans-serif" version="1.1" viewBox="0 0 1800 810" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%">
			<g id="contenidoOrganigrama">
				<!-- AQU VA EL GRAN SVG -->
			</g>
		</svg>
	</div>
	<svg display="none" xmlns="http://www.w3.org/2000/svg">
		<g id="maximizar">
			<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
		</g>
		<g id="minimizar">
			<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
		</g>
		<g id="buscar">
			<circle cx="11" cy="11" r="8"></circle>
			<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
		</g>
	</svg>
	<div id="pantallaCompleta" class="botónFlotante">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#0b437f" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#maximizar"></use></svg>
	</div>
	<div id="busqueda" class="botónFlotante">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#0b437f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#buscar"></use></svg>
	</div>
	<div id="buscadorPanel" class="oculto">
		<input id="buscadorInput" type="search" placeholder="Buscar unidad o jefatura…" autocomplete="off" spellcheck="false">
		<ul id="buscadorLista"></ul>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

	<!-- LiquidMetal: algoritmo de scoring difuso inspirado en QuickSilver -->
	<!-- Basado en liquidmetal.js por Ryan McGeary (github.com/rmm5t/liquidmetal) -->
	<script>
		const LiquidMetal = (() => {
			const SCORE_NO_MATCH  = 0.0;
			const SCORE_MATCH     = 1.0;
			const SCORE_TRAILING  = 0.8;
			const SCORE_LEADING   = 0.9;
			const SCORE_BUFFER    = 0.85;

			function score(string, abbrev) {
				if (!abbrev || abbrev.length === 0) return SCORE_TRAILING;
				if (abbrev.length > string.length)  return SCORE_NO_MATCH;
				const scores = buildScoreArray(string.toLowerCase(), abbrev.toLowerCase(), string);
				if (!scores) return SCORE_NO_MATCH;
				return scores.reduce((acc, v) => acc + v, 0) / scores.length;
			}

			function buildScoreArray(string, abbrev, original) {
				const scores    = new Array(string.length).fill(SCORE_TRAILING);
				let   lastIndex = -1;
				for (let i = 0; i < abbrev.length; i++) {
					const idx = string.indexOf(abbrev[i], lastIndex + 1);
					if (idx < 0) return null;
					lastIndex  = idx;
					const prev = idx > 0 ? string[idx - 1] : null;
					const atWordStart = idx === 0 || prev === ' ' || prev === '_' || prev === '-' || prev === '.';
					const isUpperCase = original[idx] === original[idx].toUpperCase() && original[idx] !== original[idx].toLowerCase();
					scores[idx] = (atWordStart || isUpperCase) ? SCORE_MATCH : SCORE_BUFFER;
				}
				const firstMatch = scores.indexOf(SCORE_MATCH);
				if (firstMatch > 0) {
					for (let j = 0; j < firstMatch; j++) scores[j] = SCORE_LEADING;
				}
				return scores;
			}

			return { score };
		})();
	</script>

	<script type="module">
		let datosOrganigrama, datosCuadro;
		let panel = document.getElementById("panel");
		let botónPantallaCompleta = document.getElementById("pantallaCompleta");
		let svg = d3.select('#Organigrama_SVG');
		const urlDatosOrganigrama = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdd7YSKHLGaFBb6XzN67YlYd72VGrtaHYB40U1b5_dg-zv8tf1BiJf-EqcU5DKAg/pub?gid=821030335&single=true&output=csv"


		let zoom = d3.zoom()
			.scaleExtent([1,12])
			.translateExtent([[-1800*0.75,-810*0.75],[1800*1.75,810*1.75]])
			.on('zoom', e => {
				d3.select('#contenidoOrganigrama')
					.attr('transform',e.transform);
				panel.classList.replace("visible","oculto");
				document.querySelectorAll(".activo").forEach((c) => c.classList.remove("activo"));
			});

		svg.call(zoom);
		svg.on("dblclick.zoom",()=> svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity));
		ready(async function() {
			datosOrganigrama = await d3.csv(urlDatosOrganigrama);

			const indiceBusqueda = [];

			for (let cuadro of document.querySelectorAll(".cuadroOrganigrama")) {
				let id      = cuadro.getAttribute("id");
				let Numeral = id.replace(/_/g,".").replace("c","");

				datosCuadro = datosOrganigrama.find((registro) => registro.N == Numeral);

				if (datosCuadro) {
					indiceBusqueda.push({
						id:      '#' + id,
						etiqueta: `${datosCuadro.Nombre} - ${datosCuadro.Estructura}`
					});
				}

				cuadro.addEventListener('click', (e) => {
					event.stopPropagation();
					panel.classList.replace("visible","oculto");
					datosCuadro = datosOrganigrama.find((registro) => registro.N == Numeral);
					let cajaCuadro = cuadro.getBBox();
					let centroCuadroX = cajaCuadro.x + cajaCuadro.width / 2;
					let centroCuadroY = cajaCuadro.y + cajaCuadro.height / 2;
					let fx,fy,fz;

					[fx,fy,fz] = window.matchMedia("(orientation: landscape)").matches ? [4,2,8] : [2,4,12];

					svg
						.transition()
						.duration(600)
						.call(zoom.transform,d3.zoomIdentity
					 		.translate(1800/fx,810/fy)
					 		.scale(fz)
					 		.translate(
								-centroCuadroX,
								-centroCuadroY,
							))
						.on("end", () => {
							document.querySelector("h1").textContent = datosCuadro.Nombre;
							document.querySelector("h2").textContent = datosCuadro.Cargo;
							document.querySelector("h3").textContent = datosCuadro.Estructura;

							for (let parrafo of panel.querySelectorAll('p')) {
								parrafo.remove();
							}
							panel.insertAdjacentHTML('beforeend', "<p>" + datosCuadro.Descripción.split("\n").join("</p><p>") + "</p>");
							panel.scrollTop = 0;
							panel.classList.replace("oculto","visible");
							cuadro.classList.add("activo");
						}
						);
				});
			}

			// --- Buscador ---
			const botónBusqueda   = document.getElementById("busqueda");
			const buscadorPanel   = document.getElementById("buscadorPanel");
			const buscadorInput   = document.getElementById("buscadorInput");
			const buscadorLista   = document.getElementById("buscadorLista");
			let   indiceResaltado = -1;

			function centrarNodo(id) {
				const cuadro = document.querySelector(id);
				if (!cuadro) return;
				const caja = cuadro.getBBox();
				const cx   = caja.x + caja.width  / 2;
				const cy   = caja.y + caja.height / 2;
				const [fx, fy, fz] = window.matchMedia("(orientation: landscape)").matches
					? [4, 2, 8] : [2, 4, 12];
				svg.transition().duration(400)
					.call(zoom.transform, d3.zoomIdentity
						.translate(1800/fx, 810/fy)
						.scale(fz)
						.translate(-cx, -cy));
				document.querySelectorAll(".activo").forEach(c => c.classList.remove("activo"));
				cuadro.classList.add("activo");
			}

			function abrirNodo(id) {
				const cuadro = document.querySelector(id);
				if (cuadro) cuadro.dispatchEvent(new MouseEvent('click', { bubbles: true }));
			}

			function renderLista(resultados) {
				buscadorLista.innerHTML = '';
				indiceResaltado = -1;
				resultados.forEach((r, i) => {
					const li = document.createElement('li');
					li.textContent = r.etiqueta;
					li.dataset.id  = r.id;
					li.addEventListener('mouseenter', () => {
						indiceResaltado = i;
						actualizarResaltado();
						centrarNodo(r.id);
					});
					li.addEventListener('click', () => {
						cerrarBuscador();
						abrirNodo(r.id);
					});
					buscadorLista.appendChild(li);
				});
			}

			function actualizarResaltado() {
				buscadorLista.querySelectorAll('li').forEach((li, i) => {
					li.classList.toggle('resaltado', i === indiceResaltado);
				});
			}

			function cerrarBuscador() {
				buscadorPanel.classList.replace("visible","oculto");
				buscadorInput.value = '';
				buscadorLista.innerHTML = '';
			}

			botónBusqueda.addEventListener('click', () => {
				if (buscadorPanel.classList.contains("visible")) {
					cerrarBuscador();
				} else {
					buscadorPanel.classList.replace("oculto","visible");
					buscadorInput.focus();
				}
			});

			buscadorInput.addEventListener('input', () => {
				const q = buscadorInput.value.trim();
				if (!q) { buscadorLista.innerHTML = ''; return; }
				const resultados = indiceBusqueda
					.map(item => ({ ...item, score: LiquidMetal.score(item.etiqueta, q) }))
					.filter(r => r.score > 0)
					.sort((a, b) => b.score - a.score)
					.slice(0, 8);
				renderLista(resultados);
				if (resultados.length > 0) {
					indiceResaltado = 0;
					actualizarResaltado();
					centrarNodo(resultados[0].id);
				}
			});

			buscadorInput.addEventListener('keydown', (e) => {
				const items = buscadorLista.querySelectorAll('li');
				if (!items.length) return;
				if (e.key === 'ArrowDown') {
					e.preventDefault();
					indiceResaltado = Math.min(indiceResaltado + 1, items.length - 1);
					actualizarResaltado();
					centrarNodo(items[indiceResaltado].dataset.id);
				} else if (e.key === 'ArrowUp') {
					e.preventDefault();
					indiceResaltado = Math.max(indiceResaltado - 1, 0);
					actualizarResaltado();
					centrarNodo(items[indiceResaltado].dataset.id);
				} else if (e.key === 'Enter' && indiceResaltado >= 0) {
					cerrarBuscador();
					abrirNodo(items[indiceResaltado].dataset.id);
				} else if (e.key === 'Escape') {
					cerrarBuscador();
				}
			});

			document.addEventListener("fullscreenchange",() => {
				if (document.fullscreenElement) {
					document.querySelector("#pantallaCompleta use").setAttribute("xlink:href","#minimizar");
				} else {
					document.querySelector("#pantallaCompleta use").setAttribute("xlink:href","#maximizar");
				}
			});
			botónPantallaCompleta.addEventListener('click', () => {
				if (document.fullscreenElement) {
					screen.orientation.unlock();
					document.exitFullscreen();
				} else {
					document.body.requestFullscreen();
					screen.orientation.lock('landscape').catch(() =>null);
				}
			});
			document.getElementById("telón").classList.add("oculto");
		})
	</script>
</body>
